on:
  workflow_dispatch:
      inputs:
         build-push-docker:
            description: "Build and Push docker file"
            required: true
            default: "No"
            type: choice
            options:
               -  "Yes"
               -  "No"

jobs:  
  Tester:
    runs-on: ubuntu-latest
    steps:
    -  name:  Checkout repository
       uses:  actions/checkout@v7

    -  name:  Setup python
       uses:  actions/setup-python@v7

       with:
         python-version: '3.12'
         
    -  name: Install dependencies
       run: |   
           sudo apt update
           sudo apt install python3-pip -y
           pip install -r requirements.txt

    -  name: Checking code and format errors
       run: |
        ruff check
        ruff format --check
    -  name: Testing API
       run: python -m pytest -s


  DockerJob:
      runs-on: ubuntu-latest
      if: ${{ inputs.build-push-docker == 'Yes' }}
      env:
         IMAGE_NAME: mostafaashrafdev1/student-risk-api
         IMAGE_TAG:  ${{ github.sha }}

      steps:
         -  name: Checkout repository
            uses: actions/checkout@v7
            
         -  name: Docker Login
            uses: docker/login-action@v4
            with:
               username: ${{ secrets.DOCKERHUB_USERNAME }}
               password: ${{ secrets.DOCKERHUB_TOKEN }}

         -  name: Build image
            run: |
             docker build \
             -t $IMAGE_NAME:$IMAGE_TAG \
             -t $IMAGE_NAME:latest \
             .

         -  name: Push image
            run: |
             docker push $IMAGE_NAME:$IMAGE_TAG
             docker push $IMAGE_NAME:latest
