schema: '2.0'
stages:
  train:
    cmd: python train.py
    deps:
    - path: Data/train.csv
      hash: md5
      md5: 0e388c8de55263d7bc409a314704aa0c
      size: 62744387
    - path: train.py
      hash: md5
      md5: 0d48f0116e184a79262ae728519e5ddd
      size: 3489
    params:
      params.yaml:
        train:
          model:
            LogsiticRegression:
              name: LogsiticRegression
              params:
                C: 50
                max_iter: 1000
                penalty: l2
            RandomForest:
              name: RandomForest
              params:
                n_estimators: 300
                max_depth: 20
                min_samples_split: 2
                min_samples_leaf: 1
                max_features: sqrt
                class_weight: balanced
                n_jobs: -1
