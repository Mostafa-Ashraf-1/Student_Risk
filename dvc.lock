schema: '2.0'
stages:
  train:
    cmd: python train.py
    deps:
    - path: Data/train.csv
      hash: md5
      md5: 0e388c8de55263d7bc409a314704aa0c
      size: 62744387
    - path: train.py
      hash: md5
      md5: 853278b4be75011612c293a67edeba55
      size: 2716
    params:
      params.yaml:
        train:
          model:
            LogisticRegression:
              C: 50
              max_iter: 1000
              penalty: l2
            RandomForest:
              n_estimators: 300
              max_depth: 50
              min_samples_split: 2
              min_samples_leaf: 1
              max_features: sqrt
              class_weight: balanced
              n_jobs: -1
