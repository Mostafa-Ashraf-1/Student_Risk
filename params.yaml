train:
  model:
    LogsiticRegression:
      name: LogsiticRegression
      params:
        C: 50
        max_iter: 1000
        penalty: l2

    RandomForest:
      name: RandomForest
      params:
        n_estimators: 300
        max_depth: 20
        min_samples_split: 2
        min_samples_leaf: 1
        max_features: sqrt
        class_weight: balanced
        n_jobs: -1

